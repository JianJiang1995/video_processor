appId: com.surgr1.app
productName: Surg-R1手术助手
copyright: Copyright © 2025 Surg-R1

directories:
  output: dist-electron
  buildResources: electron

files:
  - dist/**/*
  - electron/**/*

# ============================================
# extraResources: 所有服务打包进 resources/
# PyInstaller 编译的各服务位于 dist-services/ 下
# ============================================
extraResources:
  # FastAPI Backend
  - from: "../dist-services/backend"
    to: "backend"
    filter:
      - "**/*"

  # SurgR1 vLLM Service (surgical analysis)
  - from: "../dist-services/surgr1"
    to: "surgr1"
    filter:
      - "**/*"

  # GLM/Qwen: 不打包，由 Gemini 云端 API 替代 (vlm_factory 可切换)

  # SAM3 Segmentation Service
  - from: "../dist-services/sam3"
    to: "sam3"
    filter:
      - "**/*"

  # TTS CosyVoice Service
  - from: "../dist-services/tts"
    to: "tts"
    filter:
      - "**/*"

  # ASR FunASR Service
  - from: "../dist-services/asr"
    to: "asr"
    filter:
      - "**/*"

  # Shared config
  - from: "../config.json"
    to: "backend/config.json"

  # .env (API keys)
  - from: "../../.env"
    to: "backend/.env"

  # Background knowledge for GLM
  - from: "../../glm_api/background.txt"
    to: "backend/background.txt"

# Linux 配置
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64
  category: Medical
  icon: electron/icon.png
  maintainer: Surg-R1 Team
  synopsis: Surg-R1 Surgery Assistant
  description: |
    AI-powered surgery assistant with embedded backend services.
    Includes SurgR1, GLM/Qwen VLM, SAM3, TTS, and ASR.
    No separate server required.

# Windows 配置
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: electron/icon.ico
  publisherName: Surg-R1

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: electron/icon.ico
  uninstallerIcon: electron/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true

# macOS 配置
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.medical
  icon: electron/icon.icns

# 发布配置
publish:
  provider: generic
  url: https://your-update-server.com/releases/

# asar 打包 (仅前端，服务在 extraResources 不受影响)
asar: true
asarUnpack:
  - "**/*.node"

compression: normal
removePackageScripts: true
