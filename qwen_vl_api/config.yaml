# Qwen3-VL-8B-Instruct vLLM API 服务配置
# ============================================

# 模型配置
model:
  # 模型权重路径
  path: "/data2/ckpt/Qwen3-VL-8B-Instruct"
  # API中显示的模型名称
  served_model_name: "Qwen3-VL-8B"
  # 是否信任远程代码
  trust_remote_code: true

# GPU配置
gpu:
  # 使用的GPU设备ID
  # 单卡: "0" 或 "1"
  # 多卡: "0,1" 或 "2,3"
  device_ids: "1"

# 服务器配置
server:
  # 监听地址（0.0.0.0 表示允许外部访问）
  host: "0.0.0.0"
  # 服务端口（与GLM使用相同端口，同一时间只能运行一个）
  port: 8000

# vLLM引擎配置
vllm:
  # GPU显存利用率 (0.0-1.0)
  gpu_memory_utilization: 0.9
  
  # 最大模型上下文长度 (tokens)
  # Qwen3-VL 支持 262144，但实际使用 32K 足够
  max_model_len: 32768
  
  # 最大并发序列数
  max_num_seqs: 64
  
  # 张量并行度（多卡时使用）
  tensor_parallel_size: 1
  
  # 数据类型: "auto", "float16", "bfloat16"
  dtype: "bfloat16"
  
  # 是否启用前缀缓存
  enable_prefix_caching: false
  
  # 是否强制eager模式
  enforce_eager: false
  
  # Qwen3-VL 多模态相关配置
  # 限制每个请求的图片数量 (JSON格式)
  limit_mm_per_prompt: '{"image": 10}'

# 推理默认参数
inference:
  temperature: 0.7
  top_p: 0.8
  max_tokens: 2048

# 日志配置
logging:
  level: "INFO"
  file: "logs/qwen_vl_server.log"

