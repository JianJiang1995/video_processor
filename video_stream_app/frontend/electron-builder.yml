appId: com.surgr1.app
productName: Surg-R1手术助手
copyright: Copyright © 2025 Surg-R1

directories:
  output: dist-electron
  buildResources: electron

files:
  - dist/**/*
  - electron/**/*

# Linux 配置
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Medical
  icon: electron/icon.png
  maintainer: Surg-R1 Team
  synopsis: Surg-R1 Surgery Assistant
  description: |
    A professional AI-powered surgery assistant for medical video analysis.
    Features include frame-by-frame analysis, annotation, and AI-assisted detection.

# Windows 配置
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: electron/icon.ico
  publisherName: Surg-R1

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: electron/icon.ico
  uninstallerIcon: electron/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  license: LICENSE.txt
  
# macOS 配置 (可选)
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.medical
  icon: electron/icon.icns

# 发布配置
publish:
  provider: generic
  url: https://your-update-server.com/releases/

# asar 打包
asar: true
asarUnpack:
  - "**/*.node"

# 压缩
compression: normal

# 额外文件
extraFiles:
  - from: "LICENSE.txt"
    to: "LICENSE.txt"
    filter:
      - "**/*"

# 构建之后清理
removePackageScripts: true
